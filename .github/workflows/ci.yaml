name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The Release workflow runs these tests on the tag first.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # The S3 tests use MinIO on port 9100. A GitHub service can not pass
      # the `server` command to the image, so it starts with docker run.
      - name: Start MinIO
        run: |
          docker run -d --name minio -p 9100:9000 \
            -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin \
            cgr.dev/chainguard/minio:latest server /tmp/data
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      # The other Dox packages come from their newest code (main, or the
      # branch with the same name as this PR), not pub.dev. On a tag it
      # does nothing. See the script.
      - run: ci/use-siblings.sh
      # Caches the Rust dependencies of the native packages.
      - uses: Swatinem/rust-cache@v2
        if: github.ref_type != 'tag'
        with:
          workspaces: |
            ../dox-http-native/native -> target
      # Builds the native libraries of the clones, for this machine only.
      - run: ci/use-siblings.sh build
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos
      - name: Wait for MinIO
        run: timeout 90 sh -c 'until curl -sf http://localhost:9100/minio/health/live; do sleep 1; done'
      - run: dart test
      - run: dart pub publish --dry-run
