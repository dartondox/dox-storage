name: dox_storage
description: File storage for the Dox framework. One API for local disk, AWS S3 and S3-compatible services (R2, MinIO, Spaces), with swappable drivers.
version: 3.1.0
repository: https://github.com/dartondox/dox-storage
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  # Raise to the dox_annotation release that has install.dart before
  # releasing this package.
  dox_annotation: ^3.1.0
  dox_core: ^3.1.0
  http: ^1.6.0
  mime: ^2.1.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here
# (`dox storage:install`).
dox:
  commands: package:dox_storage/commands.dart

# Public AWS example keys used by the SigV4 test vectors.
false_secrets:
  - /test/fixtures/sigv4_vectors.json
