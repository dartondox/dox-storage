name: dox_storage
description: File storage for the Dox framework. One API for local disk, AWS S3 and S3-compatible services (R2, MinIO, Spaces), with swappable drivers.
version: 3.0.0-alpha.12
repository: https://github.com/dartondox/dox-storage
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  dox_core: ^3.0.0-alpha.12
  http: ^1.6.0
  mime: ^2.1.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# Public AWS example keys used by the SigV4 test vectors.
false_secrets:
  - /test/fixtures/sigv4_vectors.json
