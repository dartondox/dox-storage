name: dox_storage
description: File storage for the Dox framework. One API for local disk, AWS S3, S3-compatible services (R2, MinIO, Spaces) and Azure Blob Storage, with swappable drivers.
version: 3.2.3
repository: https://github.com/dartondox/dox-storage
homepage: https://dartondox.dev

environment:
  sdk: ^3.13.0

dependencies:
  crypto: ^3.0.7
  dox_annotation: ^3.2.0
  dox_core: ^3.2.0
  dox_http_client: ^0.0.4
  http: ^1.6.0
  mime: ^2.1.0
  path: ^1.9.1

dev_dependencies:
  lints: ^6.1.0
  test: ^1.33.0

# The `dox` CLI finds the commands of this package here
# (`dox storage:install`).
dox:
  commands: package:dox_storage/commands.dart

# Public AWS example keys used by the SigV4 test vectors, and the public
# Azurite dev account key.
false_secrets:
  - /test/fixtures/sigv4_vectors.json
  - /test/azure_shared_key_signer_test.dart
  - /test/azure_azurite_integration_test.dart
